name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  AMC_VERSION: "0.8.75"
  AMC_PKGS: "web net-http crypto mysql threading service"

jobs:
  # ====================================================================
  # Installeur Windows .exe (binaire AM auto-suffisant, sans Node/NSSM)
  # ====================================================================
  windows-installer:
    name: Build Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node 20 (build front uniquement)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inject version into front environment.ts
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $f = 'frontend/src/environments/environment.ts'
          (Get-Content $f) -replace "appVersion: '[^']*'", "appVersion: '$v'" | Set-Content $f

      - name: Build front (production)
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: "Install MariaDB (libmariadb: headers/lib pour link + DLL à bundler)"
        shell: pwsh
        run: |
          # Le paquet choco 'mariadb-connector-c' n'existe pas → on installe le
          # serveur MariaDB, qui embarque le client libmariadb (include + lib + dll).
          choco install mariadb -y --no-progress
          $mdb = Get-ChildItem 'C:\Program Files' -Directory -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -like 'MariaDB*' } | Select-Object -First 1
          if ($mdb) {
            echo "$($mdb.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
            echo "$($mdb.FullName)\lib" | Out-File -FilePath $env:GITHUB_PATH -Append
            Write-Host "MariaDB : $($mdb.FullName)"
            Get-ChildItem "$($mdb.FullName)\lib" -Filter 'libmariadb*' -ErrorAction SilentlyContinue | Select Name
            Get-ChildItem "$($mdb.FullName)\bin" -Filter 'libmariadb*.dll' -ErrorAction SilentlyContinue | Select Name
          } else { Write-Host "⚠️ MariaDB introuvable après choco" }

      - name: Install amc (MSI Windows, MinGW bundlé)
        shell: pwsh
        run: |
          $v = $env:AMC_VERSION
          curl.exe -fsSL "https://github.com/amalgame-lang/Amalgame/releases/download/v$v/amalgame-$v.msi" -o amalgame.msi
          Start-Process msiexec.exe -ArgumentList '/i','amalgame.msi','/qn','/norestart' -Wait
          $base = "C:\Program Files\Amalgame"
          if (Test-Path "$base\bin")            { echo "$base\bin"            | Out-File $env:GITHUB_PATH -Append }
          if (Test-Path "$base\gcc-bundle\bin") { echo "$base\gcc-bundle\bin" | Out-File $env:GITHUB_PATH -Append }
          Write-Host "=== Contenu $base ==="
          Get-ChildItem $base -ErrorAction SilentlyContinue -Recurse -Depth 1 | Select-Object FullName

      - name: Diagnostics toolchain
        shell: pwsh
        run: |
          Write-Host "amc : $((Get-Command amc.exe -ErrorAction SilentlyContinue).Source)"
          Write-Host "gcc : $((Get-Command gcc.exe -ErrorAction SilentlyContinue).Source)"
          amc --version

      - name: Pré-clone des packages dans le cache amc (contourne le bug git/Windows d'amc)
        shell: pwsh
        run: |
          # amc package add sur Windows quote mal l'URL git ("protocol ''https'").
          # On pré-clone chaque repo au chemin cache attendu (<tag>_<rev>) ;
          # amc package add le détecte alors "cached" et se contente de
          # précompiler la facade (pas de git clone).
          $root = "$env:USERPROFILE\.amalgame\packages\github.com\amalgame-lang"
          $pkgs = @(
            @('amalgame-crypto','v0.7.0','672b0eaf'),
            @('amalgame-tls','v0.3.3','13e6c1c8'),
            @('amalgame-async','v0.3.0','9e2c2e3e'),
            @('amalgame-net-http','v0.24.0','7d0e9d39'),
            @('amalgame-datetime','v0.2.2','1eb9f306'),
            @('amalgame-random','v0.1.0','da4ff0f7'),
            @('amalgame-logging','v0.2.0','5746d517'),
            @('amalgame-database-nosql-redis','v0.2.0','93104295'),
            @('amalgame-threading','v0.1.0','bfb5d018'),
            @('amalgame-compress','v0.1.0','2db55bb0'),
            @('amalgame-web','v0.36.1','f6fa6994'),
            @('amalgame-service','v0.2.0','c4e1ce4a'),
            @('amalgame-database-mysql','v0.3.0','a812621f')
          )
          foreach ($p in $pkgs) {
            $repo,$tag,$rev = $p
            $dest = Join-Path $root "$repo\${tag}_${rev}"
            if (-not (Test-Path $dest)) {
              Write-Host "git clone $repo@$tag → $dest"
              git clone --depth 1 --branch $tag "https://github.com/amalgame-lang/$repo.git" $dest
              if ($LASTEXITCODE -ne 0) { throw "clone $repo a échoué" }
            }
          }

      - name: Resolve amalgame packages (précompile les facades, cache déjà rempli)
        shell: pwsh
        run: |
          $pkgs = @(
            'github.com/amalgame-lang/amalgame-crypto@v0.7.0',
            'github.com/amalgame-lang/amalgame-async@v0.3.0',
            'github.com/amalgame-lang/amalgame-net-http@v0.24.0',
            'github.com/amalgame-lang/amalgame-threading@v0.1.0',
            'github.com/amalgame-lang/amalgame-web@v0.36.1',
            'github.com/amalgame-lang/amalgame-service@v0.2.0',
            'github.com/amalgame-lang/amalgame-database-mysql@v0.3.0'
          )
          foreach ($p in $pkgs) {
            Write-Host "=== amc package add $p ==="
            amc package add $p
            if ($LASTEXITCODE -ne 0) { throw "amc package add $p a échoué" }
          }

      - name: Build server.exe (build.ps1) + bundle DLL
        shell: pwsh
        run: |
          .\build.ps1
          Get-Item server.exe
          Write-Host "=== DLL bundlées ==="; Get-ChildItem windows-dll -Filter *.dll | Select Name

      - name: Install Inno Setup (si absent)
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Compile setup.iss → .exe
        shell: pwsh
        working-directory: installer
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem output

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/output/ff-tarot-*-setup.exe
          retention-days: 5

      # ---- Publication de la release ----
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FF-TAROT v${{ steps.version.outputs.version }}
          body: |
            ## FF-TAROT v${{ steps.version.outputs.version }} — back Amalgame/Mosaic

            Backend réécrit en **Amalgame** (plus de Node). Installeur Windows
            tout-en-un : installe MariaDB, enregistre **server.exe comme service
            Windows natif** (sc create, **sans NSSM**), DLL embarquées (app
            auto-suffisante), front Angular servi par le binaire, classement
            live Socket.IO.

            Login par défaut : `admin` / `admin123`.
          files: installer/output/ff-tarot-*-setup.exe
