name: Release

on:
  push:
    tags:
      - 'v*' # déclenche sur tag v1.0.0, v2.0.2, etc.

permissions:
  contents: write    # créer la GitHub Release + uploader les assets

jobs:
  # ====================================================================
  # 1. Package : archives source + front pré-buildé (Linux + Windows zip)
  # ====================================================================
  package:
    name: Archives Linux + Windows zip
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ---- Inject version into front environment (source unique = tag git) ----
      - name: Inject version into front environment.ts
        run: |
          sed -i "s/appVersion: '[^']*'/appVersion: '${{ steps.version.outputs.version }}'/" \
              frontend/src/environments/environment.ts
          grep appVersion frontend/src/environments/environment.ts

      - name: Sync version in package.json files
        run: |
          npm pkg set version=${{ steps.version.outputs.version }}
          cd frontend && npm pkg set version=${{ steps.version.outputs.version }}

      # ---- Build front (production) ----
      - name: Install front deps
        working-directory: frontend
        run: npm ci --no-fund --no-audit

      - name: Build front
        working-directory: frontend
        run: npm run build

      # ---- Préparer le contenu ----
      - name: Prepare release tree
        run: |
          set -euo pipefail
          STAGE=ff-tarot-${{ steps.version.outputs.version }}
          mkdir -p "$STAGE"

          cp -r src "$STAGE/"
          cp package.json package-lock.json db.sql seed.sql "$STAGE/"

          mkdir -p "$STAGE/frontend"
          cp -r frontend/src "$STAGE/frontend/"
          cp -r frontend/public "$STAGE/frontend/"
          cp -r frontend/dist "$STAGE/frontend/"
          cp frontend/package.json frontend/package-lock.json "$STAGE/frontend/"
          cp frontend/angular.json frontend/proxy.conf.json "$STAGE/frontend/"
          cp frontend/tsconfig*.json "$STAGE/frontend/"

          cp install.sh install.ps1 "$STAGE/"
          chmod +x "$STAGE/install.sh"

          cp Dockerfile docker-compose.yml docker-entrypoint.sh .dockerignore "$STAGE/"
          chmod +x "$STAGE/docker-entrypoint.sh"

          cp README.md INSTALL.md ROADMAP.md LICENSE "$STAGE/"

      - name: Create Linux tarball
        run: |
          tar -czf ff-tarot-${{ steps.version.outputs.version }}-linux.tar.gz \
              ff-tarot-${{ steps.version.outputs.version }}/

      - name: Create Windows zip
        run: |
          zip -rq ff-tarot-${{ steps.version.outputs.version }}-windows.zip \
              ff-tarot-${{ steps.version.outputs.version }}/

      - name: Show archive sizes
        run: ls -lh ff-tarot-*.tar.gz ff-tarot-*.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: archives-zip-tar
          path: |
            ff-tarot-*.tar.gz
            ff-tarot-*.zip
          retention-days: 1

  # ====================================================================
  # 2. Inno Setup : installeur .exe Windows tout-en-un
  # ====================================================================
  inno-installer:
    name: Inno Setup .exe (Windows)
    runs-on: windows-latest
    needs: package
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json

      - name: Inject version into front environment.ts (PowerShell)
        shell: pwsh
        run: |
          $version = '${{ needs.package.outputs.version }}'
          $file = 'frontend/src/environments/environment.ts'
          (Get-Content $file) `
            -replace "appVersion: '[^']*'", "appVersion: '$version'" `
            | Set-Content $file
          Get-Content $file | Select-String 'appVersion'

      - name: Build front (production)
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Get NSSM (via Chocolatey, fallback nssm.cc)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "installer\bin" -Force | Out-Null
          $target = "installer\bin\nssm.exe"

          # Source 1 : Chocolatey (préinstallé sur windows-latest, fiable)
          try {
            choco install nssm -y --no-progress --no-color | Out-Null
            $candidates = @(
              'C:\ProgramData\chocolatey\lib\nssm\tools\nssm.exe',
              'C:\ProgramData\chocolatey\bin\nssm.exe'
            )
            foreach ($c in $candidates) {
              if (Test-Path $c) {
                Copy-Item $c $target -Force
                Write-Host "NSSM installé via Chocolatey depuis : $c"
                break
              }
            }
          } catch {
            Write-Host "Chocolatey KO : $_"
          }

          # Source 2 : nssm.cc avec retry (fallback si choco a échoué)
          if (-not (Test-Path $target)) {
            $url = 'https://nssm.cc/release/nssm-2.24.zip'
            $zip = "$env:TEMP\nssm.zip"
            $extract = "$env:TEMP\nssm-extract"
            $ok = $false
            1..3 | ForEach-Object {
              if ($ok) { return }
              try {
                Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $zip -TimeoutSec 30
                $ok = $true
              } catch {
                Write-Host "Tentative $_ nssm.cc KO : $($_.Exception.Message)"
                Start-Sleep -Seconds 5
              }
            }
            if ($ok) {
              Expand-Archive -Path $zip -DestinationPath $extract -Force
              Copy-Item -Path "$extract\nssm-2.24\win64\nssm.exe" -Destination $target -Force
            }
          }

          if (-not (Test-Path $target)) {
            throw "Impossible d'obtenir nssm.exe (Chocolatey + nssm.cc échoués)"
          }
          Get-Item $target | Select-Object Name, Length, FullName

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # Inno Setup est pré-installé sur windows-latest sous
          # 'C:\Program Files (x86)\Inno Setup 6'. On vérifie.
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          Get-Command iscc.exe -ErrorAction SilentlyContinue
          Get-Item $iscc -ErrorAction SilentlyContinue

      - name: Show context before compile
        shell: pwsh
        working-directory: installer
        run: |
          Write-Host "=== Working dir : $(Get-Location) ==="
          Write-Host "=== installer/ contents ==="
          Get-ChildItem -Recurse -Force | Where-Object { -not $_.PSIsContainer } |
            Select-Object FullName, Length | Format-Table -AutoSize
          Write-Host "=== Frontend dist ==="
          Get-ChildItem -Path '..\frontend\dist' -ErrorAction SilentlyContinue
          Write-Host "=== ISCC version ==="
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (Test-Path $iscc) { Get-Item $iscc | Select Name, VersionInfo }
          else { Write-Host "ISCC NOT FOUND at $iscc" }

      - name: Compile setup.iss
        shell: pwsh
        working-directory: installer
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          $version = '${{ needs.package.outputs.version }}'
          Write-Host "Compiling with /DAppVersion=$version"
          # Capture stdout + stderr ensemble pour avoir l'erreur ISCC complète
          $output = & $iscc "/DAppVersion=$version" setup.iss 2>&1 | Out-String
          Write-Host '--- ISCC OUTPUT ---'
          Write-Host $output
          Write-Host '--- END ISCC OUTPUT ---'
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Get-ChildItem output

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: inno-installer
          path: installer/output/ff-tarot-*-setup.exe
          retention-days: 1

  # ====================================================================
  # 3. Release : crée la GitHub Release et y attache toutes les archives
  # ====================================================================
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [package, inno-installer]
    steps:
      - uses: actions/checkout@v4

      - name: Download zip/tar.gz archives
        uses: actions/download-artifact@v4
        with:
          name: archives-zip-tar

      - name: Download Inno Setup .exe
        uses: actions/download-artifact@v4
        with:
          name: inno-installer

      - name: List release files
        run: ls -lh ff-tarot-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FF-TAROT v${{ needs.package.outputs.version }}
          body: |
            ## FF-TAROT v${{ needs.package.outputs.version }}

            ### 📦 Téléchargement (3 méthodes au choix)

            **🪟 Windows — installeur .exe (recommandé, le plus simple)**
            - `ff-tarot-${{ needs.package.outputs.version }}-setup.exe`
            - Double-clic, suivre l'assistant. Installe Node + MariaDB
              automatiquement (winget), enregistre FF-TAROT comme service
              Windows (auto-start au boot, restart on crash via NSSM).

            **🪟 Windows — archive zip + script PowerShell (alternative)**
            - `ff-tarot-${{ needs.package.outputs.version }}-windows.zip`
            - Dézipper, ouvrir PowerShell admin dans le dossier, `.\install.ps1`.

            **🐧 Linux — archive tar.gz + script bash**
            - `ff-tarot-${{ needs.package.outputs.version }}-linux.tar.gz`
            - Décompresser, `cd ff-tarot-${{ needs.package.outputs.version }}`,
              `sudo ./install.sh`. Service systemd installé pour auto-start au boot.

            ---

            Voir [INSTALL.md](https://github.com/${{ github.repository }}/blob/v${{ needs.package.outputs.version }}/INSTALL.md)
            pour les détails complets.

            URL après install : http://localhost:3000
            (admin / admin123 par défaut — **à changer immédiatement** via la page Admin).

            ### 🗒 Changelog

            Voir l'historique git ou [ROADMAP.md](https://github.com/${{ github.repository }}/blob/v${{ needs.package.outputs.version }}/ROADMAP.md).
          files: |
            ff-tarot-*.tar.gz
            ff-tarot-*.zip
            ff-tarot-*-setup.exe
          draft: false
          prerelease: false
