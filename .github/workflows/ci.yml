name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule les runs en cours sur la même branche pour économiser les minutes CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build back + front
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # ---- Back ----
      - name: Install back deps
        run: npm ci --no-fund --no-audit

      - name: Lint back (syntax check via node --check)
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate db.sql syntax (mysqld --validate)
        run: |
          # Pas de mysqld léger dispo, on fait juste un grep sentinelle
          grep -q 'CREATE TABLE users' db.sql
          grep -q 'CREATE TABLE players' db.sql

      # ---- Front ----
      - name: Install front deps
        working-directory: frontend
        run: npm ci --no-fund --no-audit

      - name: Build front (production)
        working-directory: frontend
        run: npm run build

      - name: Verify front bundle was produced
        run: test -f frontend/dist/frontend/browser/index.html

      # ---- Validation install scripts ----
      - name: Lint install.sh
        run: bash -n install.sh

      - name: Lint docker-entrypoint.sh
        run: bash -n docker-entrypoint.sh

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate Dockerfile (build, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: ff-tarot:ci

  build-installer:
    name: Build + vérifie l'installeur Windows (.exe)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build front (production)
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Get NSSM (Chocolatey, fallback nssm.cc)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "installer\bin" -Force | Out-Null
          $target = "installer\bin\nssm.exe"

          try {
            choco install nssm -y --no-progress --no-color | Out-Null
            $candidates = @(
              'C:\ProgramData\chocolatey\lib\nssm\tools\nssm.exe',
              'C:\ProgramData\chocolatey\bin\nssm.exe'
            )
            foreach ($c in $candidates) {
              if (Test-Path $c) {
                Copy-Item $c $target -Force
                Write-Host "NSSM via Chocolatey : $c"
                break
              }
            }
          } catch {
            Write-Host "Chocolatey KO : $_"
          }

          if (-not (Test-Path $target)) {
            $url = 'https://nssm.cc/release/nssm-2.24.zip'
            $zip = "$env:TEMP\nssm.zip"
            $extract = "$env:TEMP\nssm-extract"
            $ok = $false
            1..3 | ForEach-Object {
              if ($ok) { return }
              try {
                Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $zip -TimeoutSec 30
                $ok = $true
              } catch {
                Write-Host "Tentative $_ nssm.cc KO : $($_.Exception.Message)"
                Start-Sleep -Seconds 5
              }
            }
            if ($ok) {
              Expand-Archive -Path $zip -DestinationPath $extract -Force
              Copy-Item "$extract\nssm-2.24\win64\nssm.exe" $target -Force
            }
          }

          if (-not (Test-Path $target)) {
            throw "Impossible d'obtenir nssm.exe (Chocolatey + nssm.cc échoués)"
          }
          Get-Item $target | Select-Object Name, Length, FullName

      - name: Check / install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          Get-Item $iscc | Select-Object Name, VersionInfo

      - name: Compile setup.iss
        shell: pwsh
        working-directory: installer
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          Write-Host "=== Contenu installer/ ==="
          Get-ChildItem -Recurse -Force | Where-Object { -not $_.PSIsContainer } |
            Select-Object FullName, Length | Format-Table -AutoSize
          Write-Host "=== frontend\dist ==="
          Get-ChildItem -Path '..\frontend\dist' -ErrorAction SilentlyContinue

          $output = & $iscc "/DAppVersion=0.0.0-ci" setup.iss 2>&1 | Out-String
          Write-Host '--- ISCC OUTPUT ---'
          Write-Host $output
          Write-Host '--- END ISCC OUTPUT ---'
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC a échoué (exit code $LASTEXITCODE)"
            exit $LASTEXITCODE
          }
          Get-ChildItem output

      - name: Upload .exe (debug)
        uses: actions/upload-artifact@v4
        with:
          name: installer-ci
          path: installer/output/ff-tarot-*-setup.exe
          retention-days: 3

      # ----------------------------------------------------------------
      # Vérification runtime : on LANCE réellement l'installeur en silencieux.
      # C'est ce qui détecte les erreurs runtime (MsgBox "Impossible d'installer
      # MariaDB", échec de création de base, etc.) que la simple compilation
      # ISCC laissait passer. Le runner installe vraiment MariaDB (MSI),
      # configure la base, pose le service NSSM et démarre le serveur Node.
      # ----------------------------------------------------------------
      - name: Run installer silently (/VERYSILENT) and verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem 'installer\output\ff-tarot-*-setup.exe' | Select-Object -First 1
          if (-not $exe) { throw "Aucun .exe compilé trouvé" }
          $log    = 'C:\fft-install.log'
          $appDir = 'C:\FF-TAROT'

          Write-Host "=== Lancement : $($exe.FullName) ==="
          # /SUPPRESSMSGBOXES : auto-répond aux SuppressibleMsgBox (sinon l'install
          # se bloquerait sur une boîte de dialogue d'erreur dans le runner headless).
          $p = Start-Process -FilePath $exe.FullName -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
            "/LOG=$log", "/DIR=$appDir"
          )
          $code = $p.ExitCode
          Write-Host "=== Installer exit code : $code ==="

          # --- Log d'install (toujours affiché, c'est notre source de vérité) ---
          if (Test-Path $log) {
            Write-Host '--- INSTALL LOG ---'
            Get-Content $log
            Write-Host '--- END INSTALL LOG ---'
          } else {
            Write-Warning "Pas de log d'install à $log"
          }

          $errors = @()

          if ($code -ne 0) { $errors += "exit code non nul : $code" }

          # --- Marqueurs d'échec runtime dans le log ---
          if (Test-Path $log) {
            $bad = Select-String -Path $log -SimpleMatch -Pattern @(
              "Impossible d'installer",
              'Échec téléchargement',
              'Échec de la création',
              'introuvables après install',
              'npm.cmd introuvable'
            )
            if ($bad) {
              $errors += "marqueur(s) d'échec dans le log :`n" + ($bad.Line -join "`n")
            }
          }

          # --- .env généré ? ---
          $envFile = Join-Path $appDir '.env'
          if (Test-Path $envFile) {
            Write-Host "OK : $envFile présent"
            if (-not (Select-String -Path $envFile -Pattern '^DB_PASSWORD=.+')) {
              $errors += ".env présent mais DB_PASSWORD vide"
            }
          } else {
            $errors += ".env manquant ($envFile) — ConfigureDatabase a échoué"
          }

          # --- Service Windows FF-TAROT enregistré ? ---
          $svc = Get-Service -Name 'FF-TAROT' -ErrorAction SilentlyContinue
          if ($svc) {
            Write-Host "OK : service FF-TAROT présent (status=$($svc.Status))"
          } else {
            $errors += "service Windows FF-TAROT absent — InstallService a échoué"
          }

          # --- MariaDB réellement installé ? (le bug d'origine) ---
          $mariaBin = Get-ChildItem 'C:\Program Files\MariaDB *\bin\mariadb.exe','C:\Program Files\MariaDB *\bin\mysql.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($mariaBin) {
            Write-Host "OK : client MariaDB présent ($($mariaBin.FullName))"
          } else {
            $errors += "MariaDB introuvable sous C:\Program Files\MariaDB *\bin"
          }

          if ($errors.Count -gt 0) {
            Write-Host '=== ÉCHEC VÉRIFICATION INSTALLEUR ==='
            $errors | ForEach-Object { Write-Host " - $_" }
            exit 1
          }
          Write-Host '=== Installeur vérifié avec succès ==='

      - name: Smoke test HTTP (le serveur répond sur :3000)
        shell: pwsh
        run: |
          $ok = $false
          1..20 | ForEach-Object {
            if ($ok) { return }
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri 'http://localhost:3000' -TimeoutSec 5
              if ($r.StatusCode -ge 200 -and $r.StatusCode -lt 500) {
                Write-Host "OK : http://localhost:3000 répond (HTTP $($r.StatusCode))"
                $ok = $true
              }
            } catch {
              Write-Host "Tentative $_ : pas encore de réponse ($($_.Exception.Message))"
              Start-Sleep -Seconds 3
            }
          }
          if (-not $ok) {
            Write-Warning 'Le serveur FF-TAROT ne répond pas sur :3000 — logs du service ci-dessous'
            Get-Content 'C:\FF-TAROT\logs\server.log' -ErrorAction SilentlyContinue
            throw 'Smoke test HTTP échoué'
          }

      - name: Dump install log on failure
        if: failure()
        shell: pwsh
        run: |
          Get-Content 'C:\fft-install.log' -ErrorAction SilentlyContinue
          Write-Host '--- server.log ---'
          Get-Content 'C:\FF-TAROT\logs\server.log' -ErrorAction SilentlyContinue
