name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build back AM + front (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ---- Toolchain Amalgame + libmariadb ----
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libmariadb-dev libgc-dev libssl-dev zlib1g-dev

      - name: Install amc (release tarball)
        env:
          AMC_VERSION: 0.8.83
        run: |
          curl -fsSL "https://github.com/amalgame-lang/Amalgame/releases/download/v${AMC_VERSION}/amc-${AMC_VERSION}-linux-x86_64.tar.gz" | tar -xz -C "$HOME"
          echo "$HOME/amc-${AMC_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"
          ls "$HOME/amc-${AMC_VERSION}-linux-x86_64/bin"

      - name: Resolve amalgame packages
        run: |
          for p in web net-http crypto mysql threading service; do amc package add "$p"; done

      - name: Build back AM (build.sh → server)
        run: |
          chmod +x build.sh
          ./build.sh
          test -x ./server

      # ---- Front ----
      - name: Build front (production)
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Verify front bundle
        run: test -f frontend/dist/frontend/browser/index.html

      # ---- Validation db.sql + scripts ----
      - name: Validate db.sql sentinels
        run: |
          grep -q 'CREATE TABLE users' db.sql
          grep -q 'CREATE TABLE players' db.sql
          grep -q 'scrypt' db.sql

      - name: Lint shell scripts
        run: |
          bash -n install.sh
          bash -n build.sh
          bash -n docker-entrypoint.sh
